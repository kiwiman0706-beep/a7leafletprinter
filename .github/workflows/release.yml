name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ (例 v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # setup.exe は Windows でしか組み立てられないので、別ジョブに分ける
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup を用意する
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe が見つかりません" }

      - name: バージョンを確かめて組み立てる
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          $code = python -c "import sys; sys.path.insert(0,'src'); import orihon; print(orihon.__version__)"
          if ($version -ne $code) { throw "タグ ($version) と __version__ ($code) が食い違っています" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" "installer\setup\orihon.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: setup-exe
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: setup-exe
    runs-on: ubuntu-latest
    steps:
      # タグ push のときはそのタグ、手動実行のときは実行元のブランチを取る。
      # （手動実行はタグをまだ作っていない状態でも使えるようにしてある）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係を入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pytest

      - name: テスト
        run: python -m pytest -q

      - name: バージョンを確かめる
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CODE=$(python -c "import sys; sys.path.insert(0,'src'); import orihon; print(orihon.__version__)")
          echo "タグ: $TAG / コード: $CODE"
          if [ "$VERSION" != "$CODE" ]; then
            echo "::error::タグ ($VERSION) と __version__ ($CODE) が食い違っています"
            exit 1
          fi
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 配布 ZIP を作る
        id: package
        run: |
          NAME="orihon-printer-${{ steps.version.outputs.version }}"
          mkdir -p "dist/$NAME"
          cp -r src installer tools docs "dist/$NAME/"
          cp README.md CHANGELOG.md LICENSE pyproject.toml requirements.txt "dist/$NAME/"
          find "dist/$NAME" -name '__pycache__' -type d -prune -exec rm -rf {} +
          (cd dist && zip -qr "$NAME.zip" "$NAME")
          echo "zip=dist/$NAME.zip" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: 中身を検査する
        run: |
          python - <<'PY'
          import sys, zipfile
          path = "${{ steps.package.outputs.zip }}"
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
          roots = {n.split("/")[0] for n in names}
          assert len(roots) == 1, f"最上位フォルダが複数あります: {roots}"
          root = roots.pop()
          for required in ("src/orihon/__init__.py", "installer/Install-OrihonPrinter.ps1",
                           "pyproject.toml", "README.md"):
              assert f"{root}/{required}" in names, f"{required} がありません"
          print(f"OK {path}: {len(names)} entries, root={root}")
          PY

      - name: setup.exe を受け取る
        uses: actions/download-artifact@v4
        with:
          name: setup-exe
          path: dist

      - name: リリースノートを取り出す
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - > release-notes.md <<'PY'
          import os, pathlib, re
          version = re.escape(os.environ["VERSION"])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[?{version}\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = match.group(1).strip() if match else ""
          print(body or "変更点は CHANGELOG.md を参照してください。")
          PY
          cat release-notes.md

      - name: チェックサムを添える
        run: |
          {
            echo
            echo "### ダウンロードの照合用（SHA-256）"
            echo
            echo '```'
            sha256sum "${{ steps.package.outputs.zip }}" installer/bootstrap.ps1 dist/*.exe \
              | sed 's#[^ ]*/##'
            echo '```'
            echo
            echo "PowerShell で確認する場合: \`Get-FileHash .\\OrihonPrinter-Setup-*.exe\`"
          } >> release-notes.md
          cat release-notes.md

      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "既にリリースがあるので、配布ファイルだけ差し替えます"
            gh release upload "$TAG" \
              "${{ steps.package.outputs.zip }}" "installer/bootstrap.ps1" \
              dist/*.exe --clobber
          else
            # タグがまだ無ければ、いまのコミットに作られる
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${{ steps.package.outputs.zip }}" \
              "installer/bootstrap.ps1" \
              dist/*.exe
          fi
          echo "公開しました:"
          gh release view "$TAG" --json tagName,url,assets --jq '.tagName, .url, (.assets[].name)' 
