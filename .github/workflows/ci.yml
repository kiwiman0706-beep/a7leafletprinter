name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存関係を入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pytest

      - name: テスト
        run: python -m pytest -q

      - name: レイアウトの自己点検
        run: python -m orihon layouts -v
        working-directory: src

      - name: PowerShell スクリプトの構文確認
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem installer/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "$($_.Name) に構文エラーがあります"
            }
            Write-Host "OK $($_.Name)"
          }

  setup-exe:
    name: setup.exe を組み立てる
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup を用意する
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup が無いので入れます"
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe が見つかりません: $iscc" }
          Write-Host "OK $iscc"

      - name: コンパイルする
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0,'src'); import orihon; print(orihon.__version__)"
          Write-Host "version = $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" "installer\setup\orihon.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: setup-exe
          path: dist/*.exe
          if-no-files-found: error
